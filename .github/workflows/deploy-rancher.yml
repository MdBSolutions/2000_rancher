name: Deploy Rancher

on:
  push:
    branches: [main]
    paths: ['helm/**', 'overlays/**', 'kustomization.yaml', '.github/workflows/deploy-rancher.yml']
  workflow_dispatch:

jobs:
  validate:
    name: Validate Kustomize
    uses: MdBSolutions/1000_workflows/.github/workflows/2000_infrastructure/2000-validate-kustomize.yml@main
    with:
      kustomize-dir: "overlays/production/"

  deploy:
    name: Deploy Rancher
    needs: validate
    uses: MdBSolutions/1000_workflows/.github/workflows/2000_infrastructure/2000-deploy-kustomize.yml@main
    with:
      kustomize-dir: "overlays/production/"
      namespace: "cattle-system"
      wait-timeout: "300s"
      dry-run: false

  notify:
    name: Notify Deployment Status
    if: always()
    needs: deploy
    uses: MdBSolutions/1000_workflows/.github/workflows/2000_infrastructure/2000-notify.yml@main
    with:
      status: ${{ needs.deploy.result }}
      deployment-name: "Rancher"
      environment: "production"
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
