apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cattle-system

resources:
  - namespace.yaml

helmCharts:
  - name: rancher
    repo: https://releases.rancher.com/server-charts/stable
    version: v2.10.0
    releaseName: rancher
    namespace: cattle-system
    valuesFile: helm/values.yaml
