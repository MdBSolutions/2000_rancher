# Rancher Helm values for management cluster deployment

# Image configuration
image:
  repository: rancher/rancher
  tag: v2.10.0
  pullPolicy: IfNotPresent

# Deployment replicas
replicas: 1

# Rancher hostname
hostname: rancher.internal

# Direct HTTPS access through the existing management NodePort network.
# There is no ingress controller in this platform.
tls: ingress
ingress:
  enabled: false
  servicePort: 443
  tls:
    # Avoid cert-manager Issuer creation even when ingress.enabled is false.
    source: secret

# Kubernetes allocates the HTTPS NodePort; discover it from Service/rancher.
# Keep HTTP internal for Rancher's health probes; do not expose it as a service port.
service:
  type: NodePort
  disableHTTP: true

# Resource requests/limits
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1500m
    memory: 2Gi

# Allow controller initialization to finish before liveness checks take over.
startupProbe:
  failureThreshold: 60
  periodSeconds: 10
  timeoutSeconds: 10

# Storage for Rancher data
persistence:
  enabled: true
  storageClassName: ""  # Use default storage class
  size: 10Gi
  path: /var/lib/rancher

# Leave empty so Helm does not create or own a bootstrap Secret.
# VSO supplies the mandatory reference below before the first container start.
bootstrapPassword: ""

extraEnv:
  - name: CATTLE_BOOTSTRAP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: rancher-bootstrap-password
        key: password
        optional: false

# Audit logging
auditLog:
  enabled: false
  maxAge: 30
  maxBackup: 10
  maxSize: 100

# Additional environment variables
env: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  fsGroup: 0

# Container security context
securityContext:
  privileged: false
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

# Node selector (empty = any node)
nodeSelector: {}

# Tolerations (empty = no special tolerations)
tolerations: []

# Affinity rules
affinity: {}
